<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password — EventPark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="site-header"><div id="nav-root"></div></header>

    <div class="auth-shell">
        <div class="panel">
            <h2>Reset your password</h2>
            <p class="muted">Enter your account email and we'll send you a reset link.</p>
            <div id="form-alert"></div>
            <form id="forgot-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" id="email" type="email" required autocomplete="email" />
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Send reset link</button>
            </form>
            <p class="mt-24" style="text-align:center;"><a href="login.html">Back to login</a></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
