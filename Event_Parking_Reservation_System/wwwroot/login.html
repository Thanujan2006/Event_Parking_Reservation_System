<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — EventPark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="site-header"><div id="nav-root"></div></header>

    <div class="auth-shell">
        <div class="panel">
            <h2>Welcome back</h2>
            <p class="muted">Log in to book seats and manage your tickets.</p>
            <div id="form-alert"></div>
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" id="email" type="email" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" id="password" type="password" required autocomplete="current-password" />
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Log in</button>
            </form>
            <p class="mt-24" style="text-align:center;">
                <a href="forgot-password.html">Forgot your password?</a>
            </p>
            <p style="text-align:center;">
                New here? <a href="register.html">Create an account</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
