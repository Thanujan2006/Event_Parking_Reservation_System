<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — EventPark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="site-header"><div id="nav-root"></div></header>

    <div id="loading" class="loading-spinner" style="margin-top:60px;"></div>

    <section class="page-section" id="checkout-content" style="display:none;">
        <div class="container" style="max-width:640px;">
            <div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:12px;">
                <h1 style="margin-bottom:0;">Complete your booking</h1>
                <span class="hold-timer" id="hold-timer">&#9203; --:--</span>
            </div>
            <p class="muted">Booking <span id="booking-number" style="font-family:var(--font-data);"></span> for <strong id="event-name"></strong></p>

            <div class="panel mt-24">
                <h3>Order summary</h3>
                <div id="summary-lines"></div>
                <div class="summary-total"><span>Total due</span><span id="summary-total"></span></div>
            </div>

            <div id="checkout-alert" class="mt-24"></div>

            <div class="flex gap-12 mt-24">
                <button class="btn btn-accent" id="pay-btn" style="flex:1;">Pay now (simulation)</button>
                <button class="btn btn-ghost" id="cancel-btn">Cancel booking</button>
            </div>
        </div>
    </section>

    <div id="checkout-empty" class="empty-state" style="display:none;">
        <h3>Booking not found</h3>
        <p><a href="index.html">Back to all events</a></p>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="shared.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
