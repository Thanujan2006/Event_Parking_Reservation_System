<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — EventPark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="site-header"><div id="nav-root"></div></header>

    <section class="page-section">
        <div class="container">
            <h1>Your dashboard</h1>
            <div id="loading" class="loading-spinner"></div>

            <div id="dash-content" style="display:none;">
                <div class="grid-2" style="grid-template-columns: 1.4fr 1fr;">
                    <div>
                        <div class="panel">
                            <h3>Upcoming bookings</h3>
                            <div id="upcoming-list"></div>
                        </div>

                        <div class="panel mt-24">
                            <h3>Recent payments</h3>
                            <div id="payments-list"></div>
                        </div>
                    </div>

                    <div>
                        <div class="panel">
                            <h3>Reserved parking</h3>
                            <div id="parking-list"></div>
                        </div>

                        <div class="panel mt-24">
                            <div class="flex" style="justify-content:space-between;">
                                <h3 style="margin-bottom:0;">Notifications</h3>
                                <span class="badge badge-pending" id="unread-count">0 unread</span>
                            </div>
                            <div id="notifications-list" class="mt-24"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="shared.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
