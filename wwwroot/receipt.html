<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt — EventPark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        @media print {
            .site-header, .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <header class="site-header no-print"><div id="nav-root"></div></header>

    <div id="loading" class="loading-spinner" style="margin-top:60px;"></div>

    <section class="page-section" id="receipt-content" style="display:none;">
        <div class="container" style="max-width:560px;">
            <div class="panel text-center" style="margin-bottom:20px;">
                <div style="font-size:2.2rem;">&#127881;</div>
                <h2 style="margin-bottom:4px;">Booking confirmed!</h2>
                <p class="muted">A copy of this receipt is available anytime from My Tickets.</p>
            </div>

            <div class="panel">
                <div class="flex" style="justify-content:space-between;">
                    <div>
                        <span class="ticket-eyebrow" style="color:var(--indigo);">Receipt</span>
                        <h3 id="receipt-number" style="font-family:var(--font-data);margin:0;"></h3>
                    </div>
                    <div style="text-align:right;">
                        <span class="ticket-eyebrow" style="color:var(--indigo);">Booking</span>
                        <h3 id="booking-number" style="font-family:var(--font-data);margin:0;"></h3>
                    </div>
                </div>

                <hr style="border:none;border-top:1px solid var(--line);margin:18px 0;" />

                <p><strong id="event-name"></strong><br /><span id="event-date" class="muted"></span></p>
                <p class="muted">Billed to <span id="customer-name"></span> — <span id="customer-email"></span></p>

                <div id="receipt-lines" class="mt-24"></div>
                <div class="summary-total"><span>Total paid</span><span id="receipt-total"></span></div>
                <p class="form-hint mt-24">Paid on <span id="paid-at"></span></p>
            </div>

            <div class="flex gap-12 mt-24 no-print">
                <button class="btn btn-ghost" onclick="window.print()" style="flex:1;">Print receipt</button>
                <a class="btn btn-primary" href="my-bookings.html" style="flex:1;">View my tickets</a>
            </div>
        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/receipt.js"></script>
</body>
</html>
