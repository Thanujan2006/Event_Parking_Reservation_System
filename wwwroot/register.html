<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — EventPark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="site-header"><div id="nav-root"></div></header>

    <div class="auth-shell">
        <div class="panel">
            <h2>Create your account</h2>
            <p class="muted">Takes a minute. We'll email you a verification link before you can book.</p>
            <div id="form-alert"></div>
            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full name</label>
                    <input class="form-input" id="fullName" type="text" required autocomplete="name" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" id="email" type="email" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="phone">Phone</label>
                    <input class="form-input" id="phone" type="tel" placeholder="07X XXX XXXX" />
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-input" id="password" type="password" required minlength="8" autocomplete="new-password" />
                    <div class="form-hint">At least 8 characters.</div>
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Create account</button>
            </form>
            <p class="mt-24" style="text-align:center;">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="shared.js"></script>
    <script src="register.js"></script>
</body>
</html>
