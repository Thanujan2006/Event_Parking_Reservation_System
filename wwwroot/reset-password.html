<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set new password — EventPark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="site-header"><div id="nav-root"></div></header>

    <div class="auth-shell">
        <div class="panel">
            <h2>Set a new password</h2>
            <div id="form-alert"></div>
            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label" for="password">New password</label>
                    <input class="form-input" id="password" type="password" required minlength="8" autocomplete="new-password" />
                    <div class="form-hint">At least 8 characters.</div>
                </div>
                <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Reset password</button>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
